<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Learning Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mini E-Learning Platform</h1>
  </header>

  <main id="main-content">
    <!-- Courses List -->
    <section id="courses-section">
      <h2>Available Courses</h2>
      <div id="course-list" class="course-grid"></div>
    </section>

    <!-- Course Detail View -->
    <section id="course-detail" class="hidden">
      <button id="back-btn">← Back to Courses</button>
      <h2 id="course-title"></h2>
      <p id="course-description"></p>
      <ul id="lesson-list"></ul>
      <button id="complete-btn">Mark as Completed</button>
      <p id="progress-status"></p>
    </section>
  </main>

  <footer>
    <p>© 2025 ai-intro-elearning | Built with AI Assistance</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
